command: selfplay
checkpoint: runs/residual-distillation-best.pt
output: runs/residual-history.pt
log_dir: runs/tensorboard/selfplay-history
device: cuda
precision: bf16
threads: 8
seed: 42
deterministic: false
parallel_games: 256
updates: 1000
batch_size: 256
ppo_epochs: 4
lr: 0.00003
gamma: 0.99
length_weight: 0.4
length_scale: 100
clip: 0.2
value_coefficient: 0.5
entropy: 0.01
target_kl: 0.03
# 初始模型入池；每 10 次更新保存一份冻结快照，FIFO 保留最近 64 份。
history_pool_size: 64
history_interval: 10
# 85% 的成对棋局均匀抽取历史快照，其余对抗当前模型。
history_probability: 0.85
history_inference: auto
# 在训练设备缓存教师分片，减少每次 PPO 更新时重复读取和 CPU→GPU 传输。
data_cache_mb: 4096
opening_moves: 2
opening_radius: 2
bc_data: data/c_teacher_distill
bc_coefficient: 0.1
bc_batch_size: 256
weight_decay: 0.0001
beta1: 0.9
beta2: 0.999
grad_clip: 1.0
validation_every: 10
save_every: 10
log_every: 20
resume: null
